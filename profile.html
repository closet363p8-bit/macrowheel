<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Macro Профиль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--cy:#5ad0ff;--vi:#a07bff;--pk:#ff7ad9;--gold:#ffd24a;--ok:#3be08a;--bad:#ff6b7a;--acc1:#5ad0ff;--acc2:#a07bff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:#050716}
  body{display:flex;flex-direction:column;align-items:center;padding:20px 16px 30px;gap:18px;overflow-x:hidden;position:relative}
  body.exp{--acc1:#ff8a7a;--acc2:#ff5c8a}
  body.non{--acc1:#8d93c4;--acc2:#5d6396}

  /* живой фон: северное сияние */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
  .b1{width:340px;height:340px;left:-90px;top:-60px;background:var(--acc2)}
  .b2{width:300px;height:300px;right:-110px;top:220px;background:var(--acc1);animation-duration:18s;animation-delay:-4s}
  .b3{width:280px;height:280px;left:20%;bottom:-120px;background:#ff7ad9;opacity:.35;animation-duration:22s;animation-delay:-9s}
  body.non .b3,body.exp .b3{opacity:.18}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,40px) scale(1.18)}}
  canvas#stars{position:fixed;inset:0;z-index:0;pointer-events:none}

  h1{position:relative;z-index:2;margin:2px 0 0;font-size:15px;font-weight:800;letter-spacing:5px;opacity:.85}

  /* карта */
  .stage{position:relative;z-index:2;perspective:900px;width:100%;max-width:380px}
  .card{position:relative;width:100%;aspect-ratio:1.586;border-radius:24px;transform-style:preserve-3d;
        transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s ease-out;
        box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.12);overflow:hidden;
        background:linear-gradient(135deg,#141a52 0%,#0a0d33 55%,#1a1160 100%)}
  .card::before{content:"";position:absolute;inset:0;background:
      radial-gradient(circle at 105% -10%,rgba(160,123,255,.55),transparent 55%),
      radial-gradient(circle at -10% 110%,rgba(90,208,255,.45),transparent 50%);
      filter:saturate(var(--sat,1))}
  body.exp .card::before{background:radial-gradient(circle at 105% -10%,rgba(255,90,120,.5),transparent 55%),radial-gradient(circle at -10% 110%,rgba(255,150,90,.4),transparent 50%)}
  body.non .card::before{background:radial-gradient(circle at 105% -10%,rgba(140,150,210,.35),transparent 55%),radial-gradient(circle at -10% 110%,rgba(110,120,180,.3),transparent 50%)}
  .orbits{position:absolute;right:-60px;top:-60px;width:260px;height:260px;opacity:.5}
  .holo{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.85;
        background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.55) 32%,rgba(90,208,255,.5) 40%,rgba(255,122,217,.5) 48%,rgba(255,210,74,.45) 56%,transparent 68%);
        background-size:250% 100%;background-position:calc(var(--mx,50%)*1) 0;transition:background-position .12s ease-out}
  .glare{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.28),transparent 45%);pointer-events:none}
  .inner{position:absolute;inset:0;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;letter-spacing:3px;font-size:15px}
  .logo i{font-style:normal;background:linear-gradient(90deg,var(--acc1),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .badge{font-size:11px;font-weight:800;letter-spacing:1px;padding:5px 11px;border-radius:99px;text-transform:uppercase}
  .b-a{background:rgba(59,224,138,.16);color:var(--ok);border:1px solid rgba(59,224,138,.55);box-shadow:0 0 14px rgba(59,224,138,.35)}
  .b-e{background:rgba(255,107,122,.16);color:var(--bad);border:1px solid rgba(255,107,122,.55)}
  .b-n{background:rgba(170,176,225,.14);color:#c9cdef;border:1px solid rgba(170,176,225,.4)}
  .mid{display:flex;align-items:center;gap:14px}
  .chip{width:44px;height:34px;border-radius:7px;background:linear-gradient(135deg,#ffe9a0,#c79a2b 55%,#f7d774);position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
  .chip::before,.chip::after{content:"";position:absolute;background:rgba(80,50,0,.35)}
  .chip::before{left:0;right:0;top:50%;height:1px}.chip::after{top:0;bottom:0;left:38%;width:1px;box-shadow:12px 0 0 rgba(80,50,0,.35)}
  .days{display:flex;align-items:baseline;gap:8px}
  .days b{font-size:52px;line-height:1;font-weight:800;text-shadow:0 0 24px color-mix(in srgb,var(--acc1) 70%,transparent)}
  .days span{font-size:15px;opacity:.8;font-weight:600}
  .bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .nm{font-size:16px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .num{font-size:12px;letter-spacing:2px;opacity:.7;margin-top:3px;font-variant-numeric:tabular-nums}
  .thru{text-align:right}
  .thru small{display:block;font-size:9px;letter-spacing:1.5px;opacity:.6}
  .thru b{font-size:15px;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .stamp{position:absolute;right:22px;top:52%;transform:translateY(-50%) rotate(-12deg);font-size:21px;font-weight:900;letter-spacing:3px;color:var(--bad);border:3px solid var(--bad);padding:4px 12px;border-radius:10px;opacity:0;text-shadow:0 0 12px rgba(255,107,122,.6)}
  body.exp .stamp{opacity:.9}

  /* заряд подписки */
  .panel{position:relative;z-index:2;width:100%;max-width:380px;background:rgba(16,20,66,.55);border:1px solid rgba(150,175,255,.2);border-radius:20px;padding:16px 16px 14px;backdrop-filter:blur(10px)}
  .panel h2{margin:0 0 10px;font-size:12px;letter-spacing:2px;opacity:.65;font-weight:700;display:flex;justify-content:space-between}
  .cells{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
  .cell{height:26px;border-radius:5px;background:rgba(150,170,255,.12);transition:background .3s,box-shadow .3s}
  .cell.on{background:linear-gradient(180deg,var(--acc1),var(--acc2));box-shadow:0 0 12px color-mix(in srgb,var(--acc1) 65%,transparent)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .tile{background:rgba(6,8,34,.6);border:1px solid rgba(150,175,255,.16);border-radius:14px;padding:11px 12px}
  .tile small{display:block;font-size:11px;opacity:.6;letter-spacing:.5px}
  .tile b{display:block;font-size:15px;margin-top:3px}

  .btns{position:relative;z-index:2;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
  button{border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;width:100%;font-family:inherit}
  .buy{color:#1a1000;background:linear-gradient(180deg,#ffe58a,var(--gold));box-shadow:0 5px 0 #b8860b,0 12px 28px rgba(255,210,74,.25)}
  .buy:active{transform:translateY(3px);box-shadow:0 2px 0 #b8860b}
  .cls{color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
  .appear{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <canvas id="stars"></canvas>

  <h1 class="appear">MACRO ПРОФИЛЬ</h1>

  <div class="stage appear" style="animation-delay:.1s">
    <div class="card" id="card">
      <svg class="orbits" viewBox="0 0 260 260" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1">
        <circle cx="130" cy="130" r="40"/><circle cx="130" cy="130" r="70"/><circle cx="130" cy="130" r="100"/><circle cx="130" cy="130" r="128" stroke-dasharray="3 6"/>
        <circle cx="130" cy="30" r="4" fill="#fff" stroke="none"/><circle cx="228" cy="150" r="3" fill="#5ad0ff" stroke="none"/>
      </svg>
      <div class="holo"></div><div class="glare"></div>
      <div class="inner">
        <div class="top"><div class="logo"><i>MACRO</i></div><div class="badge" id="badge"></div></div>
        <div class="mid"><div class="chip"></div><div class="days"><b id="big">0</b><span id="lbl"></span></div></div>
        <div class="bot">
          <div><div class="nm" id="nm">ПОЛЬЗОВАТЕЛЬ</div><div class="num" id="uid"></div></div>
          <div class="thru"><small>ДЕЙСТВУЕТ ДО</small><b id="until">--/--/--</b></div>
        </div>
        <div class="stamp">ЗАКОНЧИЛАСЬ</div>
      </div>
    </div>
  </div>

  <div class="panel appear" style="animation-delay:.25s">
    <h2><span>ЗАРЯД ПОДПИСКИ</span><span id="pct">0%</span></h2>
    <div class="cells" id="cells"></div>
    <div class="tiles">
      <div class="tile"><small>СТАТУС</small><b id="st">—</b></div>
      <div class="tile"><small>ПОЛНАЯ ДАТА</small><b id="full">—</b></div>
    </div>
  </div>

  <div class="btns appear" style="animation-delay:.4s">
    <button class="buy" id="buy">💳 Купить или продлить</button>
    <button class="cls" id="cls">Закрыть</button>
  </div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
const q = new URLSearchParams(location.search);
const status = q.get('s') || 'n';               // a = активна, e = закончилась, n = нет доступа
const exp = parseInt(q.get('e') || '0', 10);
const total = Math.max(1, parseInt(q.get('t') || '30', 10));
const bot = (q.get('b') || '').replace(/[^A-Za-z0-9_]/g,'');
const $ = id => document.getElementById(id);

const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
const name = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Пользователь';
$('nm').textContent = name;
const uid = String(q.get('id') || u.id || '');
$('uid').textContent = uid ? '•••• ' + uid.slice(-4) : '';

const word = n => { n=Math.abs(n); if(n%100>=11&&n%100<=14) return 'дней'; if(n%10===1) return 'день'; if(n%10>=2&&n%10<=4) return 'дня'; return 'дней'; };
const p2 = x => String(x).padStart(2,'0');
const short = ts => { const d=new Date(ts*1000); return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2); };
const full = ts => { const d=new Date(ts*1000); return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes()); };

const now = Math.floor(Date.now()/1000);
let left = 0, active = (status==='a' && exp>now);
if (active){
  left = Math.ceil((exp-now)/86400);
  $('badge').className='badge b-a'; $('badge').textContent='Активна';
  $('big').textContent=left; $('lbl').textContent=word(left);
  $('until').textContent=short(exp); $('full').textContent=full(exp); $('st').textContent='🟢 Работает';
} else if (status==='e' || status==='a'){
  document.body.classList.add('exp');
  $('badge').className='badge b-e'; $('badge').textContent='Закончилась';
  $('big').textContent='0'; $('lbl').textContent='дней';
  $('until').textContent=exp?short(exp):'--/--/--'; $('full').textContent=exp?full(exp):'—'; $('st').textContent='🔴 Не активна';
} else {
  document.body.classList.add('non');
  $('badge').className='badge b-n'; $('badge').textContent='Нет доступа';
  $('big').textContent='—'; $('lbl').textContent='подписки нет';
  $('until').textContent='--/--/--'; $('full').textContent='—'; $('st').textContent='⚪ Не включена';
}

// ячейки заряда
const N=14, cells=$('cells'), filled=Math.round(N*Math.min(1,left/total));
for(let i=0;i<N;i++){ const c=document.createElement('div'); c.className='cell'; cells.appendChild(c); }
let k=0; const fill=setInterval(()=>{ if(k>=filled){clearInterval(fill);return;} cells.children[k++].classList.add('on'); },70);
$('pct').textContent = Math.round(100*Math.min(1,left/total))+'%';

// наклон карты: за пальцем или мышью, в покое лёгкое покачивание
const card=$('card'); let touched=false;
function tilt(px,py){
  card.style.setProperty('--ry',((px-.5)*22)+'deg');
  card.style.setProperty('--rx',(-(py-.5)*18)+'deg');
  card.style.setProperty('--mx',(px*100)+'%');
  card.style.setProperty('--gx',(px*100)+'%'); card.style.setProperty('--gy',(py*100)+'%');
}
function move(e){ const t=(e.touches&&e.touches[0])||e; const r=card.getBoundingClientRect();
  touched=true; tilt(Math.min(1,Math.max(0,(t.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(t.clientY-r.top)/r.height))); }
['pointermove','touchmove'].forEach(ev=>window.addEventListener(ev,move,{passive:true}));
['pointerleave','touchend'].forEach(ev=>window.addEventListener(ev,()=>{touched=false;}));
(function sway(t){ if(!touched){ tilt(.5+Math.sin(t/1400)*.32,.4+Math.cos(t/1800)*.22); } requestAnimationFrame(sway); })(0);

// звёзды
(function(){ const c=$('stars'),x=c.getContext('2d'); let W,H,S=[];
  function size(){ W=c.width=innerWidth; H=c.height=innerHeight; S=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,a:Math.random()*6.28,v:.4+Math.random()*1.2})); }
  size(); addEventListener('resize',size);
  (function f(t){ x.clearRect(0,0,W,H); S.forEach(s=>{ x.globalAlpha=.25+.5*Math.abs(Math.sin(s.a+t/1000*s.v)); x.fillStyle='#cfe1ff'; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill(); }); requestAnimationFrame(f); })(0);
})();

$('cls').onclick = () => { if(tg) tg.close(); else window.close(); };
$('buy').onclick = () => {
  const b = bot || 'MacroVPN_official_bot';
  const link = 'https://t.me/'+b+'?start=tariffs';
  try{ tg.HapticFeedback.impactOccurred('medium'); }catch(e){}
  try{ if (tg && tg.openTelegramLink) tg.openTelegramLink(link); else window.location.href = link; }catch(e){ window.location.href = link; }
  // закрываем окно, чтобы человек оказался в чате, где бот уже показывает тарифы
  setTimeout(()=>{ try{ tg.close(); }catch(e){} }, 350);
};
</script>
</body>
</html>
