<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Macro Колесо</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg1:#070a1e;--bg2:#1a1055;--cy:#5ad0ff;--vi:#a07bff;--gold:#ffd24a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  body{background:radial-gradient(120% 80% at 50% 0%,#2b1a7a 0%,var(--bg2) 35%,var(--bg1) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.5px;text-align:center;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:0;font-size:14px;opacity:.75;text-align:center}
  .wrap{position:relative;width:min(88vw,380px);aspect-ratio:1}
  canvas{width:100%;height:100%;display:block}
  .pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:34px solid var(--gold);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));z-index:3}
  .hub{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 45%,#b8860b);box-shadow:0 0 0 5px #1a1450,0 0 24px rgba(255,210,74,.7);z-index:2;display:flex;align-items:center;justify-content:center;font-size:26px}
  #res{min-height:64px;text-align:center;font-size:22px;font-weight:800;opacity:0;transform:translateY(8px);transition:.4s}
  #res.show{opacity:1;transform:none}
  #res small{display:block;font-size:14px;font-weight:500;opacity:.8;margin-top:4px}
  button{border:0;border-radius:16px;padding:14px 34px;font-size:17px;font-weight:800;color:#1a1000;background:linear-gradient(180deg,#ffe58a,var(--gold));box-shadow:0 6px 0 #b8860b,0 10px 24px rgba(0,0,0,.45);display:none}
  button:active{transform:translateY(3px);box-shadow:0 3px 0 #b8860b}
  .confetti{position:fixed;top:-12px;width:9px;height:14px;opacity:.95;z-index:9;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
  <h1>MACRO КОЛЕСО</h1>
  <p class="sub" id="sub">Крутим…</p>
  <div class="wrap">
    <div class="pointer"></div>
    <canvas id="c"></canvas>
    <div class="hub">🎡</div>
  </div>
  <div id="res"></div>
  <button id="close">Закрыть</button>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
const buzz = t => { try{ tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} };

// Секторы колеса. Приз выдаёт бот, страница лишь красиво подводит к нужному сектору.
const SECTORS = [
  {t:'+1 день',d:1},{t:'Пусто',d:0},{t:'+2 дня',d:2},{t:'+1 день',d:1},{t:'+3 дня',d:3},
  {t:'Пусто',d:0},{t:'+5 дней',d:5},{t:'+2 дня',d:2},{t:'+10 дней',d:10},{t:'+15 дней',d:15}
];
const COLORS = ['#1b2268','#3a2a9c'];
const N = SECTORS.length, A = Math.PI*2/N;

const params = new URLSearchParams(location.search);
const wantDays = parseInt(params.get('d')||'0',10);
const cd = parseInt(params.get('cd')||'0',10);
const botName = (params.get('b')||'').replace('@','');
const cands = SECTORS.map((s,i)=>s.d===wantDays?i:-1).filter(i=>i>=0);
const target = cands.length ? cands[Math.floor(Math.random()*cands.length)] : 1;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let size, dpr;
function fit(){
  dpr = Math.min(window.devicePixelRatio||1,3);
  size = cv.clientWidth;
  cv.width = cv.height = Math.round(size*dpr);
  draw(rot);
}
let rot = 0, blink = 0;

function draw(theta){
  const s = cv.width, cx = s/2, cy = s/2, R = s/2 - s*0.035;
  ctx.clearRect(0,0,s,s);
  // внешнее кольцо
  const g = ctx.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#5ad0ff'); g.addColorStop(1,'#a07bff');
  ctx.beginPath(); ctx.arc(cx,cy,R+s*0.03,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,R+s*0.004,0,Math.PI*2); ctx.fillStyle='#0b0e30'; ctx.fill();
  // секторы
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(theta);
  for(let i=0;i<N;i++){
    const a0 = -Math.PI/2 + i*A, a1 = a0 + A;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-s*0.03,a0,a1); ctx.closePath();
    ctx.fillStyle = SECTORS[i].d===0 ? '#0e1038' : COLORS[i%2];
    ctx.fill();
    ctx.strokeStyle='rgba(160,190,255,.35)'; ctx.lineWidth=s*0.004; ctx.stroke();
    // подпись
    ctx.save(); ctx.rotate(a0 + A/2);
    ctx.textAlign='right'; ctx.textBaseline='middle';
    const big = SECTORS[i].d>=10;
    ctx.fillStyle = SECTORS[i].d===0 ? '#7f86c9' : (big ? '#ffd24a' : '#ffffff');
    ctx.font = '800 '+Math.round(s*(big?0.05:0.045))+'px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText(SECTORS[i].t,R*0.86,0);
    ctx.restore();
  }
  ctx.restore();
  // лампочки по ободу
  const lamps = 20;
  for(let i=0;i<lamps;i++){
    const a = i/lamps*Math.PI*2, rr = R+s*0.017;
    const on = ((i+blink)%2===0);
    ctx.beginPath(); ctx.arc(cx+rr*Math.cos(a), cy+rr*Math.sin(a), s*0.011, 0, Math.PI*2);
    ctx.fillStyle = on ? '#fff6c2' : '#7a6a2a';
    if(on){ ctx.shadowColor='#ffd24a'; ctx.shadowBlur=s*0.03; }
    ctx.fill(); ctx.shadowBlur=0;
  }
}

function easeOut(t){ return 1-Math.pow(1-t,4); }
function confetti(){
  const cols=['#ffd24a','#5ad0ff','#a07bff','#ff6b9a','#7dff9b'];
  for(let i=0;i<70;i++){
    const e=document.createElement('div'); e.className='confetti';
    e.style.left=Math.random()*100+'vw'; e.style.background=cols[i%cols.length];
    e.style.animationDuration=(2+Math.random()*2.2)+'s'; e.style.animationDelay=(Math.random()*0.6)+'s';
    document.body.appendChild(e); setTimeout(()=>e.remove(),5200);
  }
}

const WEEK = 7*24*3600;
function saveSpin(){
  const v = String(Math.floor(Date.now()/1000));
  try{ localStorage.setItem('wl', v); }catch(e){}
  try{ tg.CloudStorage.setItem('wl', v); }catch(e){}
}
function readSpin(cb){
  let local = 0; try{ local = parseInt(localStorage.getItem('wl')||'0',10)||0; }catch(e){}
  let done = false; const fin = c => { if(done) return; done = true; cb(Math.max(local, c||0)); };
  try{ tg.CloudStorage.getItem('wl', (err,val)=>fin(err?0:parseInt(val||'0',10))); setTimeout(()=>fin(0), 1500); }
  catch(e){ fin(0); }
}
let claimed=false;
function claim(){
  if(claimed) return; claimed=true;
  saveSpin();
  const link='https://t.me/'+botName+'?start=wheelwin';
  try{ if(tg && tg.openTelegramLink) tg.openTelegramLink(link); else window.location.href=link; }catch(e){ window.location.href=link; }
  setTimeout(()=>{ try{ tg.close(); }catch(e){} }, 400);
}
function waitText(sec){
  const d=Math.floor(sec/86400), h=Math.floor((sec%86400)/3600);
  return d? d+' дн. '+h+' ч.' : Math.max(h,1)+' ч.';
}
function finish(){
  const s = SECTORS[target], res = document.getElementById('res');
  document.getElementById('sub').textContent = '';
  if (s.d>0){
    res.innerHTML = '🎉 Выигрыш: '+s.t+'<small>Бот сейчас добавит дни к твоему доступу</small>';
    confetti(); buzz('heavy');
  } else {
    res.innerHTML = 'Не повезло 😔<small>Попробуй ещё через неделю</small>';
    buzz('medium');
  }
  res.classList.add('show');
  const b = document.getElementById('close'); b.style.display='block';
  b.textContent = s.d>0 ? 'Забрать приз' : 'Готово';
  b.onclick = claim;
  setTimeout(claim, 2600);
}

function spin(){
  const final = Math.PI*2*6 + (-(target+0.5)*A);
  const t0 = performance.now(), dur = 5200;
  let lastTick = -1;
  (function frame(now){
    const p = Math.min(1,(now-t0)/dur);
    rot = final*easeOut(p);
    blink = Math.floor(now/140);
    const tick = Math.floor(rot/A);
    if(tick!==lastTick){ lastTick=tick; if(p<0.97) buzz('light'); }
    draw(rot);
    if(p<1) requestAnimationFrame(frame); else finish();
  })(t0);
}
window.addEventListener('resize',fit);
fit();
function locked(sec){
  document.getElementById('sub').textContent='';
  const res=document.getElementById('res');
  res.innerHTML='⏳ Следующее вращение через '+waitText(sec)+'<small>Одна попытка в неделю</small>';
  res.classList.add('show');
  const b=document.getElementById('close'); b.style.display='block'; b.textContent='Закрыть';
  b.onclick=()=>{ if(tg) tg.close(); else window.close(); };
}
if (cd>0){
  locked(cd);
} else {
  readSpin(last=>{
    const left = WEEK - (Math.floor(Date.now()/1000) - last);
    if (last && left>0) locked(left); else setTimeout(spin,300);
  });
}
</script>
</body>
</html>
